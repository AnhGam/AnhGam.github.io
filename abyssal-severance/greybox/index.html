<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abyssal Severance — Greybox 1–3 (640×360 Pixel-Perfect)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #070b12; color: #d6e4ec; font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 10px;
    user-select: none;
  }
  .bar {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center;
    background: #0e1726; border: 1px solid #1e3148; padding: 6px 10px; border-radius: 6px; font-size: 12px;
  }
  .bar button {
    background: #16243a; color: #c7d9e6; border: 1px solid #2b4563; padding: 4px 10px; border-radius: 4px;
    cursor: pointer; font: inherit;
  }
  .bar button:hover { background: #1f3350; }
  .bar button.active { background: #1f6f78; border-color: #3ee8d8; color: #fff; }
  .sep { width: 1px; height: 18px; background: #263a52; margin: 0 2px; }
  #stage-wrap {
    position: relative; background: #000; border: 2px solid #1d3247; border-radius: 4px;
    box-shadow: 0 12px 40px rgba(0,0,0,.65); line-height: 0;
  }
  canvas {
    display: block;
    width: min(1280px, calc(100vw - 24px), calc((100vh - 110px) * 16 / 9));
    aspect-ratio: 16 / 9; height: auto;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  .keys { font-size: 11px; color: #8aa4b8; text-align: center; max-width: 960px; line-height: 1.5; }
  kbd { background: #16243a; border: 1px solid #2e4866; padding: 1px 5px; border-radius: 3px; color: #e6f4f1; }
</style>
</head>
<body>
  <div class="bar">
    <strong>ABYSSAL SEVERANCE</strong>
    <span class="sep"></span>
    <button data-scene="zoo" class="active">1: Metrics Zoo</button>
    <button data-scene="combat">2: Combat Loop</button>
    <button data-scene="boss1">3: Boss B1 Cự Giải</button>
    <span class="sep"></span>
    <button data-form="F0" class="active">F0 (Cơ bản)</button>
    <button data-form="F1">F1 (Đôi Chân)</button>
    <button data-form="F2">F2 (Đôi Tay)</button>
    <span class="sep"></span>
    <button id="btn-reset">Reset (R)</button>
    <button id="btn-hud">Telemetry (F3)</button>
  </div>
  <div id="stage-wrap">
    <canvas id="game" width="640" height="360"></canvas>
  </div>
  <div class="keys">
    <kbd>A/D</kbd> hoặc <kbd>←/→</kbd> Di chuyển · <kbd>W/Space/Z</kbd> Nhảy (giữ để nhảy cao, <kbd>S</kbd> cúi/bò 24px, <kbd>S+J</kbd> Pogo) ·
    <kbd>Shift/K</kbd> Dash (F0: Quẫy Vây 4ô, F1: Áp Suất 7ô+iFrame) · <kbd>J/X</kbd> Chém (trúng viền bạc = Clash Parry!) ·
    <kbd>L/C</kbd> Bắn (33 Mana) · <kbd>Q/E</kbd> Hồi Bình · <kbd>F</kbd> Móc Neo (F2) · <kbd>F3</kbd> Bật/tắt Telemetry
  </div>
  <script src="game.js"></script>
</body>
</html>
