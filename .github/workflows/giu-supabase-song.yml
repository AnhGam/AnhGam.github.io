# Giữ dự án Supabase bậc miễn phí hoạt động: 7 ngày không có truy vấn thì Supabase tạm dừng dự án.
# Mỗi 2 ngày gọi một yêu cầu nhẹ. Khoá lấy từ Secrets của kho này, không nằm trong kho môn học.
# Hạng mục: uit-se100-2026-hk1/se100-N05#67 · Phụ trách: N05-B
name: giu-supabase-song

on:
  schedule:
    - cron: '17 1 */2 * *'   # 01:17 UTC, cách 2 ngày
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Gọi Supabase (kèm retry lỗi DNS và dự phòng 1.1.1.1)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Chưa đặt secret SUPABASE_URL / SUPABASE_ANON_KEY, bỏ qua."; exit 0
          fi
          base_url="${SUPABASE_URL%/}"
          target="$base_url/auth/v1/settings"

          # Dùng --retry-all-errors để curl thử lại cả lỗi DNS exit code 6.
          set +e
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 4 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 20 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$target")
          rc=$?

          # Nếu DNS mặc định của runner vẫn lỗi code 6, phân giải qua DNS công cộng dự phòng.
          if [ "$rc" -eq 6 ]; then
            host=$(printf '%s' "$base_url" | sed -E 's#^https?://([^/:]+).*#\1#')
            ip=""
            for resolver in 1.1.1.1 8.8.8.8; do
              ip=$(dig +short @"$resolver" "$host" A 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
              [ -n "$ip" ] && break
            done
            if [ -n "$ip" ]; then
              echo "DNS mặc định lỗi, dùng DNS dự phòng cho $host -> $ip"
              code=$(curl -sS -o /dev/null -w '%{http_code}' \
                --retry 3 --retry-delay 4 --retry-all-errors \
                --connect-timeout 10 --max-time 20 \
                --resolve "$host:443:$ip" \
                -H "apikey: $SUPABASE_ANON_KEY" \
                "$target")
              rc=$?
            fi
          fi
          set -e

          echo "curl_exit=$rc HTTP=$code"
          [ "$rc" -eq 0 ] && [ "$code" = "200" ]
