# Giữ dự án Supabase bậc miễn phí hoạt động: 7 ngày không có truy vấn thì Supabase tạm dừng dự án.
# Mỗi 2 ngày gọi một yêu cầu nhẹ. Khoá lấy từ Secrets của kho này, không nằm trong kho môn học.
# Hạng mục: uit-se100-2026-hk1/se100-N05#67 · Phụ trách: N05-B
name: giu-supabase-song

on:
  schedule:
    - cron: '17 1 */2 * *'   # 01:17 UTC, cách 2 ngày
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Chưa đặt secret SUPABASE_URL / SUPABASE_ANON_KEY, bỏ qua."; exit 0
          fi
          # Endpoint cấu hình auth: khoá publishable gọi được, không phụ thuộc tên bảng.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/auth/v1/settings")
          echo "HTTP $code"
          [ "$code" = "200" ]
